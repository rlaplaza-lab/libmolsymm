coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 2%

ignore:
  - "tests/**"
  - "examples/**"
  - "python/**"
  - "fortran/**"
  - "build*/**"
  - "_deps/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
