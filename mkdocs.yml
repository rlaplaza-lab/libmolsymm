site_name: libmolsymm
site_description: Molecular point-group symmetry library (C++20, C, Python, Fortran)
site_url: https://rlaplaza-lab.github.io/libmolsymm/
repo_url: https://github.com/rlaplaza-lab/libmolsymm
repo_name: rlaplaza-lab/libmolsymm

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections

nav:
  - Home: index.md
  - API: api.md

markdown_extensions:
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
