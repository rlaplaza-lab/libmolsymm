site_name: libmolsymm
site_description: Molecular point-group symmetry library (C++20, C, Python, Fortran)
site_url: https://rlaplaza-lab.github.io/libmolsymm/
repo_url: https://github.com/rlaplaza-lab/libmolsymm
repo_name: rlaplaza-lab/libmolsymm

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections

nav:
  - Home: index.md
  - API:
      - Python: api/python.md
      - C++: api/cpp.md
      - C: api/c.md
      - Fortran: api/fortran.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            allow_inspection: false
            show_source: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_bases: false
            members_order: source
            docstring_style: numpy
            docstring_section_style: table
            merge_init_into_class: true
            show_labels: true
            line_length: 88
            filters:
              - "!^_"
              - "!^(ArrayLike|Float64Array|Sequence|TypeAlias)$"

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - tables
  - toc:
      permalink: true
