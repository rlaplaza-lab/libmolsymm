name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install lint tools
        run: |
          # GitHub images sometimes ship a broken Microsoft packages mirror (403).
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/msprod.list \
                     /etc/apt/sources.list.d/microsoft*.list || true
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy clang-tools cppcheck \
            python3-dev python3-pip ninja-build cmake g++ libeigen3-dev
          python3 -m pip install --user ruff 'clang-format==23.1.3'

      - name: clang-format
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mapfile -t FILES < <(find include src tests examples python -type f \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' \) | sort)
          clang-format --dry-run --Werror "${FILES[@]}"

      - name: Configure for compile_commands
        run: |
          cmake -S . -B build-lint -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER=g++ \
            -DMOLSYMM_BUILD_PYTHON=ON \
            -DMOLSYMM_BUILD_FORTRAN=OFF \
            -DMOLSYMM_BUILD_TESTS=ON

      - name: clang-tidy
        run: |
          mapfile -t TUS < <(find src tests examples python -name '*.cpp' | sort)
          run-clang-tidy -p build-lint -quiet "${TUS[@]}"

      - name: cppcheck
        run: |
          mapfile -t FILES < <(find include src tests examples python -type f \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' \) | sort)
          cppcheck --enable=all --error-exitcode=1 --inline-suppr \
            --std=c++20 --force \
            -I include \
            -DMOLSYMM_TEST_DATA_DIR=\"tests/data\" \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --suppress=useStlAlgorithm \
            --suppress=ConfigurationNotChecked \
            --suppress=unusedStructMember \
            --suppress=checkersReport \
            --suppress=normalCheckLevelMaxBranches \
            "${FILES[@]}"

      - name: ruff
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ruff check tests .github/scripts
          ruff format --check tests .github/scripts

      - name: mypy
        run: |
          python3 -m pip install --user mypy numpy
          export PATH="$HOME/.local/bin:$PATH"
          mypy

  test:
    name: test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            cc: gcc
            cxx: g++
            fc: gfortran
            build_type: Release
          - compiler: g++
            cc: gcc
            cxx: g++
            fc: gfortran
            build_type: Debug
          - compiler: clang++
            cc: clang
            cxx: clang++
            fc: gfortran
            build_type: Release
          - compiler: clang++
            cc: clang
            cxx: clang++
            fc: gfortran
            build_type: Debug
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          # GitHub images sometimes ship a broken Microsoft packages mirror (403).
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/msprod.list \
                     /etc/apt/sources.list.d/microsoft*.list || true
          sudo apt-get update
          pkgs=(build-essential cmake ninja-build gfortran
                python3-dev python3-numpy libeigen3-dev)
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            pkgs+=(clang)
          fi
          sudo apt-get install -y "${pkgs[@]}"
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          FC: ${{ matrix.fc }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMOLSYMM_BUILD_PYTHON=ON \
            -DMOLSYMM_BUILD_FORTRAN=ON \
            -DMOLSYMM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600

  sanitize:
    name: sanitize (clang++ ASan+UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          # GitHub images sometimes ship a broken Microsoft packages mirror (403).
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/msprod.list \
                     /etc/apt/sources.list.d/microsoft*.list || true
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build libeigen3-dev

      - name: Configure (C++ tests only, sanitized)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DMOLSYMM_BUILD_PYTHON=OFF \
            -DMOLSYMM_BUILD_FORTRAN=OFF \
            -DMOLSYMM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        # Exclude combinatorial audits (own target); they run on Debug/Release/coverage.
        run: ctest --test-dir build --output-on-failure --timeout 180 -E 'audit'

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          # GitHub images sometimes ship a broken Microsoft packages mirror (403).
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/msprod.list \
                     /etc/apt/sources.list.d/microsoft*.list || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build gcovr \
            python3-dev python3-numpy libeigen3-dev

      - name: Configure (coverage)
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage" \
            -DMOLSYMM_BUILD_PYTHON=ON \
            -DMOLSYMM_BUILD_FORTRAN=OFF \
            -DMOLSYMM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600

      - name: Coverage report
        run: |
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'src/' \
            --filter 'include/' \
            --exclude-unreachable-branches \
            --exclude-throw-branches \
            --fail-under-line 90 \
            --html-details coverage-html/index.html \
            --json-summary coverage-summary.json \
            --json-summary-pretty \
            --print-summary \
            build
          test -s coverage-summary.json
          test -f coverage-html/index.html
          python3 .github/scripts/write_coverage_badge.py \
            coverage-summary.json .github/badges/coverage.svg

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            coverage-html/
            coverage-summary.json
          retention-days: 30

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: update coverage badge [skip ci]"
          git push

  ci:
    name: CI gate
    runs-on: ubuntu-24.04
    needs: [lint, test, sanitize, coverage]
    if: always()
    steps:
      - name: Require all jobs succeeded
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "sanitize=${{ needs.sanitize.result }}"
          echo "coverage=${{ needs.coverage.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.sanitize.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
