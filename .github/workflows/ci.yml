name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-tools cppcheck python3-pip ninja-build cmake g++
          python3 -m pip install --user ruff 'clang-format==23.1.3'

      - name: clang-format
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mapfile -t FILES < <(find include src tests examples python -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' \) | sort)
          clang-format --dry-run --Werror "${FILES[@]}"

      - name: Configure for compile_commands
        run: |
          cmake -S . -B build-lint -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER=g++ \
            -DMOLSYMM_BUILD_PYTHON=OFF \
            -DMOLSYMM_BUILD_FORTRAN=OFF \
            -DMOLSYMM_BUILD_TESTS=ON

      - name: clang-tidy
        run: |
          mapfile -t TUS < <(find src tests examples -name '*.cpp' | sort)
          # run-clang-tidy is quieter and parallel; fail on any finding
          run-clang-tidy -p build-lint -quiet "${TUS[@]}"

      - name: cppcheck
        run: |
          mapfile -t FILES < <(find include src tests examples python -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' \) | sort)
          cppcheck --enable=all --error-exitcode=1 --inline-suppr \
            --std=c++20 --force \
            -I include \
            -DMOLSYMM_TEST_DATA_DIR=\"tests/data\" \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --suppress=useStlAlgorithm \
            --suppress=ConfigurationNotChecked \
            --suppress=unusedStructMember \
            --suppress=checkersReport \
            --suppress=knownConditionTrueFalse \
            --suppress=duplicateCondition \
            --suppress=duplicateAssignExpression \
            "${FILES[@]}"

      - name: ruff
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ruff check tests/test_python.py

  test:
    name: test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            cc: gcc
            cxx: g++
            fc: gfortran
          - compiler: clang++
            cc: clang
            cxx: clang++
            fc: gfortran
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build gfortran \
            python3-dev python3-numpy \
            ${{ matrix.compiler == 'clang++' && 'clang' || 'g++' }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          FC: ${{ matrix.fc }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOLSYMM_BUILD_PYTHON=ON \
            -DMOLSYMM_BUILD_FORTRAN=ON \
            -DMOLSYMM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
