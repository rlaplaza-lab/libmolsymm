name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: Upload target
        required: true
        default: pypi
        type: choice
        options:
          - pypi
          - testpypi
      confirm:
        description: Type "publish" to confirm upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run Python tests
        env:
          MOLSYMM_TEST_DATA_DIR: ${{ github.workspace }}/tests/data
        run: python -m pytest tests/test_python.py -q

  build_sdist:
    needs: test
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Read package version
        run: |
          VERSION=$(python -c "import pathlib, re; print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          echo "Publishing libmolsymm $VERSION to ${{ github.event.inputs.target }}"

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    needs: test
    if: github.event.inputs.confirm == 'publish'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    needs: [build_sdist, build_wheels]
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdist
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify distributions
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
          ls -la dist/

      - name: Publish to PyPI
        if: github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          # Allow re-runs / adding new platform wheels for an existing version.
          skip-existing: true

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
